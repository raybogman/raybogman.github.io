{% unless page.url == "/" %}
{% assign is_blog = false %}
{% if page.collection == "posts" or page.url contains "/blog/" %}{% assign is_blog = true %}{% endif %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Home", "item": "{{ site.url }}/" }
    {%- if is_blog -%}
    ,{ "@type": "ListItem", "position": 2, "name": "Blog", "item": "{{ site.url }}/blog/" }
      {%- if page.url != "/blog/" -%}
      {%- if paginator and paginator.page > 1 -%}
      ,{ "@type": "ListItem", "position": 3, "name": "Page {{ paginator.page }}", "item": "{{ page.url | absolute_url }}" }
      {%- else -%}
      ,{ "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": "{{ page.url | absolute_url }}" }
      {%- endif -%}
      {%- endif -%}
    {%- else -%}
    ,{ "@type": "ListItem", "position": 2, "name": {{ page.title | jsonify }}, "item": "{{ page.url | absolute_url }}" }
    {%- endif %}
  ]
}
</script>
{% endunless %}
